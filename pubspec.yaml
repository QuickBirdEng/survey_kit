name: survey_kit
description: Create beautiful surveys with Flutter (inspired by iOS ResearchKit Surveys)
version: 1.0.4
homepage: https://quickbirdstudios.com
repository: https://github.com/quickbirdstudios/survey_kit
issue_tracker: https://github.com/quickbirdstudios/survey_kit/issues

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  chewie: ^1.12.1
  collection: ^1.16.0
  cupertino_icons: ^1.0.2
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.4+3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  lottie: ^3.3.1
  rxdart: ^0.28.0
  universal_html: ^2.3.0
  url_launcher: ^6.1.10
  uuid: ^4.6.0
  video_player: ^2.10.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.0
