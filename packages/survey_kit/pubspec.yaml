name: survey_kit
description: Create beautiful surveys with Flutter (inspired by iOS ResearchKit Surveys)
version: 2.0.0-beta4
homepage: https://quickbirdstudios.com
repository: https://github.com/QuickBirdEng/survey_kit
issue_tracker: https://github.com/QuickBirdEng/survey_kit/issues

resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  intl: ^0.20.2
  json_annotation: ^4.12.0
  meta: ^1.17.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
  generate: true
