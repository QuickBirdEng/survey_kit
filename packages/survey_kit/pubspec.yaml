name: survey_kit
description: Create beautiful surveys with Flutter (inspired by iOS ResearchKit Surveys)
version: 2.0.0-beta2
homepage: https://quickbirdstudios.com
repository: https://github.com/quickbirdstudios/survey_kit
issue_tracker: https://github.com/quickbirdstudios/survey_kit/issues

resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  intl: ^0.20.2
  json_annotation: ^4.9.0
  meta: ^1.17.0
  url_launcher: ^6.1.10
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.14
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.3

flutter:
  generate: true
